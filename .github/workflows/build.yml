name: Build desktop packages

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file rpm libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev
      - run: npm ci
      - name: Build .deb and .rpm packages
        run: npm run tauri build -- --bundles deb,rpm
      - name: Confirm Linux packages were generated
        run: |
          find src-tauri/target/release/bundle -maxdepth 3 -type f -print
          test "$(find src-tauri/target/release/bundle -type f \( -name '*.deb' -o -name '*.rpm' \) | wc -l)" -gt 0
      - uses: actions/upload-artifact@v4
        with:
          name: hamtigram-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    env:
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build Windows setup executable
        run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: hamtigram-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  test-release:
    if: github.event_name == 'workflow_dispatch'
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hamtigram-*
          path: release-assets
          merge-multiple: true
      - name: Publish TEST prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: TEST
          target_commitish: main
          name: TEST
          prerelease: true
          generate_release_notes: true
          files: release-assets/**
