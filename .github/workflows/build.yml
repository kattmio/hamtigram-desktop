name: Build desktop packages

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file rpm libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev
      - run: npm ci
      - name: Build .deb and .rpm packages
        run: npm run tauri build -- --bundles deb,rpm
      - uses: actions/upload-artifact@v4
        with:
          name: hamtigram-linux
          path: src-tauri/target/release/bundle/**/*.{deb,rpm}
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    env:
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build Windows setup executable
        run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: hamtigram-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
