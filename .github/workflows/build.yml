name: Сборка настольного клиента HamtiGram

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Установить системные зависимости Tauri для Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file rpm libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev
      - run: npm ci
      - name: Собрать пакеты .deb и .rpm
        run: npm run tauri build -- --bundles deb,rpm
      - name: Проверить, что пакеты Linux созданы
        run: |
          find src-tauri/target/release/bundle -maxdepth 3 -type f -print
          test "$(find src-tauri/target/release/bundle -type f \( -name '*.deb' -o -name '*.rpm' \) | wc -l)" -gt 0
      - uses: actions/upload-artifact@v4
        with:
          name: Установщики HamtiGram — Linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    env:
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Собрать установщик Windows
        run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Установщики HamtiGram — Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  test-release:
    if: github.event_name == 'workflow_dispatch'
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Установщики HamtiGram — *
          path: release-assets
          merge-multiple: true
      - name: Опубликовать предварительный выпуск TEST
        uses: softprops/action-gh-release@v2
        with:
          tag_name: TEST
          target_commitish: main
          name: TEST
          prerelease: true
          body: "Тестовый предварительный выпуск HamtiGram для проверки установщиков. Это не стабильный выпуск."
          generate_release_notes: false
          files: release-assets/**
