[package]
name = "hamtigram-desktop"
version = "0.1.0"
description = "HamtiGram desktop client"
authors = ["HamtiGram community"]
edition = "2021"
rust-version = "1.90"

[package.metadata.tauri-winres]
FileDescription = "HamtiGram desktop client"
ProductName = "HamtiGram"
OriginalFilename = "hamtigram-desktop.exe"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
